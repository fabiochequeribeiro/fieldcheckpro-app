name: SonoIA - Compilar APK Android de teste
on:
  push:
    branches:
      - experimentos/sonoia-apk
    paths:
      - '.github/workflows/sonoia-apk.yml'
      - 'sonoia/**'
  workflow_dispatch:
jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gerar APK debug
        shell: bash
        working-directory: sonoia
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: SonoIA-Android-APK-debug
          path: sonoia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
